```html
{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <h1>Create Account</h1>

    <p>Start building a more rational mind.</p>

    {% if error %}
        <p class="feedback-error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

{% endblock %}
```
